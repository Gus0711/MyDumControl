name: myglobaldc
description: "Application de gestion des automates ECLYPSE Distech Controls"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Local Database
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  share_plus: ^10.1.4
  file_picker: ^8.0.3

  # WebView (Envysion Designer integration)
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.1

  # Utils
  equatable: ^2.0.5
  dartz: ^0.10.1
  intl: ^0.20.3
  logger: ^2.3.0
  uuid: ^4.4.0
  crypto: ^3.0.3

  # Platform detection
  universal_platform: ^1.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

  # Testing
  mocktail: ^1.0.3

  # App icon generation
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/synoptics/

# Configuration flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logov2_no_back.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logov2_no_back.png"
    background_color: "#F5F5F5"
    theme_color: "#1565C0"
  windows:
    generate: true
    image_path: "assets/images/logov2_no_back.png"
  macos:
    generate: true
    image_path: "assets/images/logov2_no_back.png"
  linux:
    generate: true
    image_path: "assets/images/logov2_no_back.png"
